openapi: 3.1.0
info:
  title: Portable Codex Relay
  version: 0.1.0
  description: >-
    REST broker for a ChatGPT Custom GPT to request file operations on a paired desktop companion.
    The relay forwards JSON to the device and never reads or writes disk. Workspace trust, path sandboxing,
    credential checks, and optional write-approval prompts are enforced entirely on the companion; treat
    every Action call as non-consequential at the Chat layer because the device is the authority that allows or denies work.

servers:
  - url: https://YOUR-RELAY-URL.example.com

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key

  schemas:
    ToolError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: false

    ApprovalRequired:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
      additionalProperties: false

    ListTrustedWorkspacesRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Optional target device ID. Defaults to the API token's default device.
      additionalProperties: true

    GetGptInstructionsRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Optional target device ID. Defaults to the API token's default device.
      additionalProperties: true

    ListSkillsRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Optional target device ID. Defaults to the API token's default device.
      additionalProperties: true

    GetSkillRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Optional target device ID. Defaults to the API token's default device.
        skillName:
          type: string
          description: Skill name to load. Use the text after / when the user activates /skill-name.
        maxBytes:
          type: integer
          description: Maximum UTF-8 bytes of SKILL.md instructions to return.
          minimum: 1
      required:
        - skillName
      additionalProperties: true

    ListDirRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID.
        deviceId:
          type: string
          description: Optional target device ID.
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        path:
          type: string
          description: Relative path inside the workspace. Defaults to .
          default: "."
      additionalProperties: true

    ReadFileRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        path:
          type: string
          description: Relative file path inside the workspace.
        encoding:
          type: string
          enum:
            - utf-8
            - base64
          default: utf-8
        maxBytes:
          type: integer
          minimum: 1
      required:
        - path
      additionalProperties: true

    WriteFileRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        path:
          type: string
        content:
          type: string
        createDirectories:
          type: boolean
          default: true
      required:
        - path
        - content
      additionalProperties: true

    PatchOperation:
      type: object
      properties:
        find:
          type: string
          description: Literal text to find.
        replace:
          type: string
          description: Literal replacement text.
        occurrence:
          type: integer
          minimum: 1
        replaceAll:
          type: boolean
          default: false
      required:
        - find
        - replace
      additionalProperties: false

    ApplyPatchRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        patch:
          type: string
          description: >-
            Codex-style multi-file patch string. Use the *** Begin Patch / *** Add File /
            *** Update File / *** Delete File / *** End Patch format.
        path:
          type: string
          description: Relative file path for legacy literal replacement operations.
        operations:
          type: array
          description: Legacy literal replacement operations applied in order.
          minItems: 1
          items:
            $ref: "#/components/schemas/PatchOperation"
      additionalProperties: true

    SearchFilesRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        path:
          type: string
          default: "."
        query:
          type: string
        isRegex:
          type: boolean
          default: false
        caseSensitive:
          type: boolean
          default: false
        maxResults:
          type: integer
          minimum: 1
        fileExtensions:
          type: array
          items:
            type: string
        multithreaded:
          type: boolean
          description: Enable parallel file scanning for large searches. Defaults to false.
          default: false
        maxSearchThreads:
          type: integer
          description: Maximum parallel file search workers. The companion clamps this to a safe maximum.
          minimum: 1
      required:
        - query
      additionalProperties: true

    StatPathRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        path:
          type: string
          default: "."
      additionalProperties: true

    MakeDirRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        path:
          type: string
      required:
        - path
      additionalProperties: true

    DeletePathRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        path:
          type: string
        recursive:
          type: boolean
          default: false
      required:
        - path
      additionalProperties: true

    RunCommandRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        command:
          type: string
          description: Command line to run from the trusted workspace.
        workdir:
          type: string
          description: Codex-style working directory. Takes priority over workingDirectory.
        workingDirectory:
          type: string
          description: Relative working directory inside the workspace. Defaults to .
          default: "."
        timeoutMs:
          type: integer
          description: Command timeout in milliseconds. The companion clamps this to a safe maximum.
          minimum: 1000
          default: 60000
        maxOutputBytes:
          type: integer
          description: Maximum UTF-8 bytes to return for stdout and stderr separately.
          minimum: 1
          default: 200000
        stdin:
          type: string
          description: Optional stdin text to write before closing stdin for this one-shot command.
      required:
        - command
      additionalProperties: true

    ShellRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        command:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: >-
            Command to run. For Codex-style shell calls this may be an argv array, such as
            ["powershell.exe", "-Command", "Get-ChildItem"]. String aliases cmd and commandLine are also accepted.
        cmd:
          type: string
          description: Codex exec_command shell command string.
        commandLine:
          type: string
          description: Alias for command.
        workdir:
          type: string
          description: Codex-style working directory. Takes priority over workingDirectory aliases.
        workingDirectory:
          type: string
          description: Relative working directory inside the workspace. Defaults to .
          default: "."
        working_directory:
          type: string
          description: Snake-case alias for workingDirectory.
        timeoutMs:
          type: integer
          description: Command timeout in milliseconds. The companion clamps this to a safe maximum.
          minimum: 1000
          default: 60000
        timeout_ms:
          type: integer
          description: Snake-case alias for timeoutMs.
          minimum: 1000
        maxOutputBytes:
          type: integer
          description: Maximum UTF-8 bytes to return for stdout and stderr separately.
          minimum: 1
          default: 200000
        max_output_bytes:
          type: integer
          description: Snake-case alias for maxOutputBytes.
          minimum: 1
        yield_time_ms:
          type: integer
          description: >-
            For exec_command sessions, how long to wait for output before returning a session_id.
          minimum: 0
        max_output_tokens:
          type: integer
          description: Approximate Codex-style output budget. The companion converts this to a byte limit.
          minimum: 1
        tty:
          type: boolean
          description: Keep stdin open for later write_stdin calls when using exec_command.
        shell:
          type: string
          description: Accepted for Codex compatibility. The companion currently uses its default shell runner.
        login:
          type: boolean
          description: Accepted for Codex compatibility.
        stdin:
          type: string
          description: Optional stdin text to write when starting the command.
        input:
          type: string
          description: Alias for stdin.
      additionalProperties: true

    WriteStdinRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        processId:
          type: string
          description: Running process identifier from a Codex-style shell session.
        sessionId:
          type: string
          description: Alias for processId used by some harnesses.
        session_id:
          type: integer
          description: Codex-style numeric session identifier returned by exec_command.
        chars:
          type: string
          description: Characters to write to stdin. May be empty to poll for output.
        yield_time_ms:
          type: integer
          description: How long to wait for output before returning.
          minimum: 0
        max_output_tokens:
          type: integer
          description: Approximate Codex-style output budget. The companion converts this to a byte limit.
          minimum: 1
        stdin:
          type: string
        input:
          type: string
          description: Alias for stdin.
      additionalProperties: true

    RequestPermissionsRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Optional target device ID. Defaults to the API token's default device.
        permissions:
          type: array
          items:
            type: string
          description: Compatibility shim permission names requested by older clients.
        reason:
          type: string
          description: Optional human-readable reason for the permission request.
      additionalProperties: true

    ViewImageRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            If omitted, the companion uses its selected current workspace. The device rejects any path
            outside configured trusted roots regardless of this request.
        path:
          type: string
          description: Relative path of a local image file inside the workspace.
        maxBytes:
          type: integer
          description: Maximum image size to return as a data URL. Defaults to 5000000.
          minimum: 1
      required:
        - path
      additionalProperties: true

    ViewDesktopRequest:
      type: object
      properties:
        requestId:
          type: string
        deviceId:
          type: string
        workspaceRoot:
          type: string
          description: >-
            Optional absolute path of a workspace the user has already trusted in the Portable Codex companion.
            Required when path is supplied so the screenshot can be saved inside a trusted workspace.
        path:
          type: string
          description: >-
            Optional relative path inside the workspace to save the desktop screenshot. When supplied,
            the response can include an expiring imageUrl for opening the saved image.
        screen:
          type: string
          default: primary
          description: >-
            Desktop display to view. Use primary, all, or a zero-based display index such as 0 or 1.
        maxBytes:
          type: integer
          description: Maximum image size to return inline. Defaults to 5000000.
          minimum: 1
      additionalProperties: true

    ClickDesktopRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Optional target device ID. Defaults to the API token's default device.
        x:
          type: integer
          description: Desktop X coordinate to click.
        y:
          type: integer
          description: Desktop Y coordinate to click.
        button:
          type: string
          enum:
            - left
            - right
            - middle
          default: left
          description: Mouse button to click. Defaults to left.
        clicks:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Number of clicks to send. Defaults to 1.
      required:
        - x
        - y
      additionalProperties: true

    BrowserGetStateRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Browser device ID. Defaults to the API token's default device if omitted.
        tabId:
          type: integer
          description: Optional Chrome tab ID. Defaults to the active tab in the last-focused window.
        selector:
          type: string
          description: Optional CSS selector to scope returned HTML and text.
        includeHtml:
          type: boolean
          default: true
          description: Include redacted outer HTML for the page or selected element.
        includeText:
          type: boolean
          default: false
          description: Include visible text from the page or selected element.
        maxHtmlBytes:
          type: integer
          minimum: 1000
          default: 200000
          description: Maximum UTF-8 bytes of HTML to return. The extension truncates longer output.
        maxElements:
          type: integer
          minimum: 1
          maximum: 500
          default: 120
          description: Maximum interactive elements to include in the actionability snapshot.
        redact:
          type: boolean
          default: true
          description: Redact form field values and sensitive attributes before returning HTML.
      additionalProperties: true

    BrowserClickRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Browser device ID. Defaults to the API token's default device if omitted.
        tabId:
          type: integer
          description: Optional Chrome tab ID. Defaults to the active tab in the last-focused window.
        selector:
          type: string
          description: CSS selector for the element to click.
        text:
          type: string
          description: Fallback visible text, aria-label, title, or placeholder to match when selector is omitted.
        x:
          type: number
          description: Viewport X coordinate to click when selector/text is omitted.
        y:
          type: number
          description: Viewport Y coordinate to click when selector/text is omitted.
        button:
          type: string
          enum:
            - left
            - right
            - middle
          default: left
        clicks:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
        scrollIntoView:
          type: boolean
          default: true
        waitAfterMs:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
      additionalProperties: true

    BrowserFillRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Browser device ID. Defaults to the API token's default device if omitted.
        tabId:
          type: integer
          description: Optional Chrome tab ID. Defaults to the active tab in the last-focused window.
        selector:
          type: string
          description: CSS selector for an input, textarea, select, or contenteditable element.
        text:
          type: string
          description: Fallback visible label, placeholder, aria-label, title, or nearby text to match.
        value:
          type: string
          description: Value to place in the field.
        clear:
          type: boolean
          default: true
        submit:
          type: boolean
          default: false
          description: Submit the nearest form after filling when possible.
      required:
        - value
      additionalProperties: true

    BrowserKeypressRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Browser device ID. Defaults to the API token's default device if omitted.
        tabId:
          type: integer
          description: Optional Chrome tab ID. Defaults to the active tab in the last-focused window.
        selector:
          type: string
          description: Optional element to focus before dispatching keyboard events.
        key:
          type: string
          description: Keyboard key value, such as Enter, Escape, Tab, or a printable character.
        ctrlKey:
          type: boolean
          default: false
        altKey:
          type: boolean
          default: false
        shiftKey:
          type: boolean
          default: false
        metaKey:
          type: boolean
          default: false
      required:
        - key
      additionalProperties: true

    BrowserNavigateRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Browser device ID. Defaults to the API token's default device if omitted.
        tabId:
          type: integer
          description: Optional Chrome tab ID. Defaults to the active tab in the last-focused window.
        url:
          type: string
          description: URL to open.
        newTab:
          type: boolean
          default: false
          description: Open the URL in a new tab instead of reusing the active tab.
      required:
        - url
      additionalProperties: true

    BrowserBackRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Browser device ID. Defaults to the API token's default device if omitted.
        tabId:
          type: integer
          description: Optional Chrome tab ID. Defaults to the active tab in the last-focused window.
      additionalProperties: true

    BrowserForwardRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Browser device ID. Defaults to the API token's default device if omitted.
        tabId:
          type: integer
          description: Optional Chrome tab ID. Defaults to the active tab in the last-focused window.
      additionalProperties: true

    BrowserReloadRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Browser device ID. Defaults to the API token's default device if omitted.
        tabId:
          type: integer
          description: Optional Chrome tab ID. Defaults to the active tab in the last-focused window.
        bypassCache:
          type: boolean
          default: false
      additionalProperties: true

    BrowserScreenshotRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Browser device ID. Defaults to the API token's default device if omitted.
        tabId:
          type: integer
          description: Optional Chrome tab ID. Defaults to the active tab in the last-focused window.
        format:
          type: string
          enum:
            - png
            - jpeg
          default: png
        quality:
          type: integer
          minimum: 1
          maximum: 100
          description: JPEG quality when format is jpeg.
      additionalProperties: true

    BrowserEvalRequest:
      type: object
      properties:
        requestId:
          type: string
          description: Optional caller-generated request ID. The relay generates one if omitted.
        deviceId:
          type: string
          description: Browser device ID. Defaults to the API token's default device if omitted.
        tabId:
          type: integer
          description: Optional Chrome tab ID. Defaults to the active tab in the last-focused window.
        code:
          type: string
          description: JavaScript body to run in the active page. Must return serializable data. Requires the extension's unsafe script setting and allowUnsafeScript=true on this request.
        args:
          type: array
          items: {}
        allowUnsafeScript:
          type: boolean
          default: false
          description: Per-call acknowledgment required for browser_eval.
      required:
        - code
      additionalProperties: true

    ImageResult:
      type: object
      description: Metadata for an image returned by view_image or view_desktop.
      properties:
        path:
          type: string
        screen:
          type: string
        width:
          type: integer
        height:
          type: integer
        mimeType:
          type: string
        bytes:
          type: integer
        artifactId:
          type: string
          format: uuid
          description: Full UUID used in the artifact GET request path.
        imageUrl:
          type: string
          format: uri
          description: Expiring URL for retrieving the image without inline base64 transport.
        expiresAt:
          type: string
          format: date-time
          description: Expiration time for imageUrl.
        inlineImageReturned:
          type: boolean
        inlineImageTruncated:
          type: boolean
      additionalProperties: true

    ImageToolResponse:
      type: object
      description: >-
        Action-friendly image tool response. OpenAPI Actions return link metadata only; use result.imageUrl
        to retrieve the image instead of transporting inline base64 in the tool response.
      required:
        - requestId
        - status
      properties:
        requestId:
          type: string
        status:
          type: string
          enum:
            - ok
            - denied
            - error
            - timeout
        result:
          $ref: "#/components/schemas/ImageResult"
        error:
          $ref: "#/components/schemas/ToolError"
        approvalRequired:
          $ref: "#/components/schemas/ApprovalRequired"
      additionalProperties: true

    ToolResponse:
      type: object
      description: >-
        Relay response from the paired device. Trust and filesystem access are decided on the device;
        `status` may be `denied` or include `approvalRequired` when the companion blocks or defers a change.
      required:
        - requestId
        - status
      properties:
        requestId:
          type: string
        status:
          type: string
          enum:
            - ok
            - denied
            - error
            - timeout
        result:
          description: Tool-specific payload when status is ok.
        error:
          $ref: "#/components/schemas/ToolError"
        approvalRequired:
          $ref: "#/components/schemas/ApprovalRequired"
      additionalProperties: true

paths:
  /tools/list-trusted-workspaces:
    post:
      x-openai-isConsequential: false
      operationId: list_trusted_workspaces
      summary: List the trusted workspace roots available on the connected device.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListTrustedWorkspacesRequest"
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResponse"

  /tools/get-gpt-instructions:
    post:
      x-openai-isConsequential: false
      operationId: get_gpt_instructions
      summary: Return the latest Custom GPT instructions from the paired companion.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetGptInstructionsRequest"
      responses:
        "200":
          description: Tool result with result.instructions containing the current instruction text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResponse"

  /tools/list-skills:
    post:
      x-openai-isConsequential: false
      operationId: list_skills
      summary: List imported Codex CLI style skills available on the connected device.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListSkillsRequest"
      responses:
        "200":
          description: Tool result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolResponse"

  /tools/get-skill:
    post:
      x-openai-isConsequential: false
      operationId: get_skill
      summary: Load a Codex CLI style skill by name and return its SKILL.md instructions.
      requestBody:
        required: true
